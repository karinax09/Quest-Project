<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" 
     rel="stylesheet"
     >
     <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{%block title%}{%endblock%}</title>
</head>
<body>
        <header class="site-header">

    <a href="/" class="site-logo">

        <svg class="bi me-2" width="40" height="32" aria-hidden="true">
            <use xlink:href="#bootstrap"></use>
        </svg>

        <span class="text_my">КВЕСТ-КОМНАТА</span>

    </a>

    <ul class="site-nav">

        <li class="nav-item">
            <a href="{{ url_for('index') }}" title="Нажми чтобы перейти" class="nav-link active" aria-current="page">
                Главная
            </a>
        </li>

        <li class="nav-item">
           <a href="{{ url_for('levels') }}" title="Нажми чтобы перейти" class="nav-link">
                Уровни
            </a>
        </li>

        <li class="nav-item">
            <a href="{{ url_for('actors')}}" title="Нажми чтобы перейти"  class="nav-link">
                Персонажи
            </a>
        </li>


        <li class="nav-item">
            <a href="/#price" title="Нажми чтобы перейти"  class="nav-link">
                Price
            </a>
        </li>

    </ul>
    </header>
    <main>
                                                                  

   {%block body%}
   {%endblock%}


    </main>



<footer class="hospital-footer d-flex flex-wrap justify-content-between align-items-center py-4 px-4 ">

    <div class="col-md-4 d-flex align-items-center">

        <a href="/"
           class="me-2 text-decoration-none"
           aria-label="Hospital">

            <span class="footer-logo">H</span>

        </a>

        <span class="footer-copy">
            © 2026 HOSPITAL. Все права защищены.
        </span>

    </div>

    <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">

        <li class="ms-3">
            <a class="footer-social" href="#" aria-label="Instagram">
                <svg class="bi" width="24" height="24" aria-hidden="true">
                    <use xlink:href="#instagram"></use>
                </svg>
            </a>
        </li>

        <li class="ms-3">
            <a class="footer-social" href="#" aria-label="Facebook">
                <svg class="bi" width="24" height="24" aria-hidden="true">
                    <use xlink:href="#facebook"></use>
                </svg>
            </a>
        </li>

    </ul>

</footer>
    

</body>
</html>
